[workspace]
members = [
    "adbx_editor",
    "adbx_runtime",
    "adbx_shared",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["adbxEngine Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { version = "0.17.3", default-features = true, features = ["file_watcher"] }
mlua = { version = "0.9", features = ["lua54", "async", "send", "vendored"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.1"
anyhow = "1.0"
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
dirs = "5.0"
arboard = "3.3"
syntect = "5.3"
rfd = "0.14"
regex = "1.11"