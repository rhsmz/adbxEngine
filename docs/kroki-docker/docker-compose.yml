version: '3.8'

services:
  kroki:
    image: yuzutech/kroki:latest
    container_name: kroki
    ports:
      - "8000:8000"
    environment:
      - KROKI_BLOCKDIAG_ENABLED=true
      - KROKI_PLANTUML_ENABLED=true
      - KROKI_DIAGRAMS_NET_ENABLED=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
